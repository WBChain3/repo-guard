[project]
name = "repo-guard"
version = "0.1.0"
description = "CLI security scanner for GitHub repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.24.0",
    "ruff>=0.1.0",
]

[project.scripts]
repo-guard = "repo_guard.cli:main"
